<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kindle↔Audio">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111317" id="metaTheme">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='24' fill='%23111317'/%3E%3Crect x='8' y='8' width='104' height='104' rx='18' fill='none' stroke='%23a3b56b' stroke-width='2'/%3E%3Ctext x='60' y='78' font-size='58' text-anchor='middle' fill='%23a3b56b' font-family='serif'%3E%E2%87%84%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='24' fill='%23111317'/%3E%3Ctext x='60' y='78' font-size='58' text-anchor='middle' fill='%23a3b56b' font-family='serif'%3E%E2%87%84%3C/text%3E%3C/svg%3E">
<title>Kindle ↔ Audiolibro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #111317;
    --surface: #1a1d23;
    --surface-2: #23272f;
    --line: #333944;
    --ink: #ece6d8;
    --muted: #a9afb8;
    --accent: #a3b56b;
    --accent-ink: #15180e;
    --accent-soft: rgba(163,181,107,0.13);
    --warn: #e59a74;
    --danger: #e8806a;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --serif: 'Spectral', Georgia, serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #eee9dd;
    --surface: #fffdf8;
    --surface-2: #f4f0e6;
    --line: #dcd5c4;
    --ink: #23211d;
    --muted: #5b5952;
    --accent: #55692a;
    --accent-ink: #ffffff;
    --accent-soft: rgba(85,105,42,0.11);
    --warn: #9a4521;
    --danger: #a8402a;
    --shadow: 0 1px 2px rgba(60,50,30,0.12);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 var(--sans);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }
  [hidden] { display: none !important; }

  .app {
    max-width: 460px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; gap: 16px;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }

  /* Header */
  header { display: flex; align-items: center; gap: 4px; }
  .book-btn {
    flex: 1; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 8px;
    text-align: left; border-radius: 12px; padding: 4px 6px 4px 2px;
  }
  .book-btn .t {
    font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .book-btn svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--muted); }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    color: var(--muted); flex-shrink: 0;
  }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn:active, .book-btn:active { background: var(--surface-2); }

  /* Mode switch */
  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
    background: var(--surface-2); border-radius: 14px;
  }
  .seg button {
    min-height: 44px; border-radius: 10px; font-weight: 600; font-size: 15px; color: var(--muted);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .seg button svg { width: 18px; height: 18px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  /* Main card */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 20px 18px 14px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lbl { font-size: 15px; color: var(--muted); }
  .chips { display: flex; gap: 4px; }
  .chips button {
    min-width: 44px; height: 34px; padding: 0 10px; border-radius: 9px; font-size: 14px; font-weight: 600;
    color: var(--muted); border: 1px solid var(--line);
  }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .big-in {
    width: 100%; margin-top: 8px; padding: 4px 0 8px;
    font-family: var(--mono); font-weight: 600; font-size: 44px; line-height: 1.1;
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
    background: transparent; border: 0; border-bottom: 2px solid var(--line); border-radius: 0;
    -webkit-appearance: none; appearance: none;
  }
  .big-in:focus { outline: none; border-bottom-color: var(--accent); }
  .big-in::placeholder { color: var(--line); }
  .warn { color: var(--warn); font-size: 14px; margin-top: 8px; }

  .res-lbl { margin-top: 22px; }
  .out {
    width: 100%; margin-top: 8px; padding: 14px 16px; border-radius: 16px;
    background: var(--accent-soft); text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    transition: transform 0.1s;
  }
  .out:active { transform: scale(0.985); }
  .out .main {
    font-family: var(--mono); font-weight: 600; font-size: 46px; line-height: 1.1;
    font-variant-numeric: tabular-nums; color: var(--ink); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .out .main small { font-size: 16px; font-weight: 500; color: var(--muted); font-family: var(--sans); }
  .out .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .out .copy { color: var(--accent); flex-shrink: 0; }
  .out .copy svg { width: 22px; height: 22px; }
  .out.flash { background: var(--accent); }
  .out.flash .main, .out.flash .sub, .out.flash .copy, .out.flash small { color: var(--accent-ink); }

  .adjust {
    margin-top: 6px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;
    color: var(--accent); font-weight: 600; font-size: 15px;
  }
  .adjust svg { width: 18px; height: 18px; }

  .setup { text-align: center; padding: 18px 4px 10px; }
  .setup p { color: var(--muted); margin: 0 0 16px; }

  .foot {
    margin-top: auto; min-height: 44px; padding: 8px; border-radius: 12px;
    color: var(--muted); font-size: 14px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .foot:active { background: var(--surface-2); }

  .btn {
    min-height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 600; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--surface-2); color: var(--ink); }
  .btn.danger-solid { background: var(--danger); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn.block { width: 100%; }
  .btn svg { width: 18px; height: 18px; }

  /* Dialogs as bottom sheets */
  dialog.sheet {
    width: 100%; max-width: 460px; max-height: 90vh; max-height: 90dvh;
    margin: auto auto 0; padding: 0; border: 1px solid var(--line); border-bottom: 0;
    border-radius: 22px 22px 0 0; background: var(--surface); color: var(--ink);
    overflow: auto; overscroll-behavior: contain;
  }
  dialog.sheet::backdrop { background: rgba(0,0,0,0.55); }
  @media (min-width: 600px) {
    dialog.sheet { margin: auto; border-radius: 22px; border-bottom: 1px solid var(--line); }
  }
  .sheet-in { padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .sheet h2 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 0; }
  .sheet p.txt { color: var(--muted); margin: 0 0 16px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 15px; color: var(--muted); margin-bottom: 6px; }
  .field .hint { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
  .in {
    width: 100%; min-height: 48px; padding: 10px 12px; font-size: 17px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
    -webkit-appearance: none; appearance: none;
  }
  .in.num { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .in:focus { outline: none; border-color: var(--accent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .err { color: var(--warn); font-size: 14px; margin: -6px 0 12px; }

  .section-t { font-size: 15px; font-weight: 600; margin: 22px 0 4px; }
  ul.points { list-style: none; margin: 10px 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  ul.points li {
    display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 14px; min-height: 50px;
    border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  ul.points li:first-child { border-top: 0; }
  ul.points .p { flex: 1; }
  ul.points .tm { font-family: var(--mono); font-weight: 500; }
  ul.points li.bad { color: var(--warn); text-decoration: line-through; }
  .empty { color: var(--muted); font-size: 15px; margin: 8px 0 12px; }

  .list { list-style: none; margin: 0 0 12px; padding: 0; }
  .list button {
    width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px;
    text-align: left; padding: 8px 10px; border-radius: 12px;
  }
  .list button:active { background: var(--surface-2); }
  .list .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; display: grid; place-items: center; }
  .list button[aria-current="true"] .dot { border-color: var(--accent); }
  .list button[aria-current="true"] .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; }
  .list .meta { color: var(--muted); font-size: 14px; }
  .list svg { width: 20px; height: 20px; color: var(--muted); }

  .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; }
  .opt-row .seg { min-width: 190px; }
  .opt-row .seg button { min-height: 38px; font-size: 14px; }
  .divider { height: 1px; background: var(--line); margin: 8px 0; }

  .faq h3 { font-size: 16px; margin: 16px 0 4px; }
  .faq p { margin: 0; color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 50; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <button class="book-btn" id="bookBtn" aria-haspopup="dialog">
      <span class="t" id="bookName"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" data-taria="settingsTitle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 8h7M9 12h5"/></svg>
    </button>
    <button class="icon-btn" id="menuBtn" data-taria="menuTitle">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <div class="seg" role="group" id="modeSeg">
    <button data-mode="p2a">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-1.6-1.3-3.8-1.6-7-1v13c3.2-.6 5.4-.3 7 1 1.6-1.3 3.8-1.6 7-1V5c-3.2-.6-5.4-.3-7 1Z"/><path d="M12 6v13"/></svg>
      <span data-t="modeP2A"></span>
    </button>
    <button data-mode="a2p">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
      <span data-t="modeA2P"></span>
    </button>
  </div>

  <main class="card">
    <div id="setupBox" class="setup" hidden>
      <p data-t="setupNeeded"></p>
      <button class="btn primary" id="setupBtn" data-t="setupBtn"></button>
    </div>

    <div id="calcBox">
      <div class="row">
        <label class="lbl" id="inLabel" for="posIn"></label>
        <div class="chips" id="unitChips" role="group">
          <button data-unit="page" data-t="unitPage"></button>
          <button data-unit="pct">%</button>
          <button data-unit="loc" data-t="unitLoc"></button>
        </div>
      </div>
      <input class="big-in" id="posIn" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="0">
      <input class="big-in" id="timeIn" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="0:00:00" hidden>
      <div class="warn" id="warn" role="status" hidden></div>

      <div class="lbl res-lbl" id="outLabel"></div>
      <button class="out" id="out" aria-live="polite">
        <div>
          <div class="main" id="outMain">—</div>
          <div class="sub" id="outSub" hidden></div>
        </div>
        <span class="copy" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        </span>
      </button>
      <button class="adjust" id="adjustBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
        <span data-t="adjust"></span>
      </button>
    </div>
  </main>

  <button class="foot" id="foot"></button>
</div>

<!-- Book list -->
<dialog class="sheet" id="booksDlg">
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sheet-head"><h2 data-t="booksTitle"></h2></div>
    <ul class="list" id="booksList"></ul>
    <button class="btn ghost block" id="newBookBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span data-t="newBook"></span>
    </button>
  </div>
</dialog>

<!-- Book settings -->
<dialog class="sheet" id="settingsDlg">
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 data-t="settingsTitle"></h2>
      <button class="btn primary" data-close data-t="done"></button>
    </div>
    <div class="field">
      <label for="fTitle" data-t="fTitle"></label>
      <input class="in" id="fTitle" type="text" autocomplete="off" data-tph="fTitlePh">
    </div>
    <div class="two">
      <div class="field">
        <label for="fPages" data-t="fPages"></label>
        <input class="in num" id="fPages" type="text" inputmode="numeric" autocomplete="off">
      </div>
      <div class="field">
        <label for="fDur" data-t="fDur"></label>
        <input class="in num" id="fDur" type="text" inputmode="numeric" autocomplete="off" placeholder="0:00:00">
      </div>
    </div>
    <div class="field">
      <label for="fLocs" data-t="fLocs"></label>
      <input class="in num" id="fLocs" type="text" inputmode="numeric" autocomplete="off">
      <div class="hint" data-t="fLocsHint"></div>
    </div>

    <div class="section-t" data-t="pointsTitle"></div>
    <div class="hint lbl" data-t="pointsHint" style="font-size:14px"></div>
    <ul class="points" id="pointsList"></ul>
    <div class="empty" id="pointsEmpty" data-t="pointsEmpty"></div>
    <div class="warn" id="pointsWarn" data-t="pointsDropped" hidden style="margin:0 0 10px"></div>
    <button class="btn ghost block" id="addPointBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span data-t="addPoint"></span>
    </button>

    <div class="divider" style="margin:22px 0 8px"></div>
    <button class="btn danger block" id="deleteBookBtn" data-t="deleteBook"></button>
  </div>
</dialog>

<!-- Reference point -->
<dialog class="sheet" id="pointDlg">
  <form class="sheet-in" id="pointForm" method="dialog">
    <div class="grab"></div>
    <div class="sheet-head"><h2 data-t="pointTitle"></h2></div>
    <p class="txt" data-t="pointText"></p>
    <div class="two">
      <div class="field">
        <label for="pPos" id="pPosLabel"></label>
        <input class="in num" id="pPos" type="text" inputmode="numeric" autocomplete="off">
      </div>
      <div class="field">
        <label for="pTime" data-t="pointTime"></label>
        <input class="in num" id="pTime" type="text" inputmode="numeric" autocomplete="off" placeholder="0:00:00">
      </div>
    </div>
    <div class="err" id="pErr" role="alert" hidden></div>
    <div class="two">
      <button type="button" class="btn ghost" data-close data-t="cancel"></button>
      <button type="submit" class="btn primary" data-t="save"></button>
    </div>
  </form>
</dialog>

<!-- Menu -->
<dialog class="sheet" id="menuDlg">
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 data-t="menuTitle"></h2>
      <button class="btn ghost" data-close data-t="close"></button>
    </div>
    <div class="opt-row">
      <span data-t="theme"></span>
      <div class="seg" role="group" id="themeSeg">
        <button data-theme="dark" data-t="themeDark"></button>
        <button data-theme="light" data-t="themeLight"></button>
      </div>
    </div>
    <div class="opt-row">
      <span data-t="language"></span>
      <div class="seg" role="group" id="langSeg">
        <button data-lang="es">Español</button>
        <button data-lang="en">English</button>
      </div>
    </div>
    <div class="divider"></div>
    <ul class="list">
      <li><button id="helpBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg><span class="name" data-t="help"></span></button></li>
      <li><button id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg><span class="name" data-t="exportBtn"></span></button></li>
      <li><button id="importBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg><span class="name" data-t="importBtn"></span></button></li>
    </ul>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</dialog>

<!-- Help -->
<dialog class="sheet" id="helpDlg">
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 data-t="help"></h2>
      <button class="btn ghost" data-close data-t="close"></button>
    </div>
    <div class="faq" id="faq"></div>

(function () {

  const dict = {

      deleteBook: 'Eliminar este libro',
      deletePoint: 'Eliminar punto',
      done: 'Listo', close: 'Cerrar', save: 'Guardar', cancel: 'Cancelar', del: 'Eliminar',

      pointText: 'Escribe dónde estás de verdad en el libro y en el audio. Se guarda como referencia y afina los cálculos de ahora en adelante.',

      pointErrTime: 'El tiempo tiene que estar dentro de la duración del audiolibro.',
      booksTitle: 'Tus libros', newBook: 'Nuevo libro',

      faq: [
        ['¿Cómo se usa?', 'Elige el libro arriba, escribe por dónde vas y te dice dónde poner el audio. Con el selector de arriba cambias la dirección, del audio al libro. Toca el resultado para copiarlo.'],

        ['¿Página, porcentaje o posición?', 'Usa lo que te enseñe el Kindle. Para usar la posición, añade antes las posiciones totales en los datos del libro.'],
        ['Mi audiolibro tiene capítulos. ¿Me sirve?', 'Si tu reproductor marca capítulos, esos marcadores son exactos. Esta app está pensada sobre todo para audios de un solo archivo largo, sin cortes.'],
        ['¿Dónde se guardan mis datos?', 'Solo en este dispositivo, dentro del navegador. Nadie más los ve. Si cambias de móvil o de navegador, exporta una copia de seguridad desde Opciones e impórtala en el nuevo.']
      ]
    },
    en: {
      appTitle: 'Kindle ↔ Audiobook',
      untitled: 'Untitled book',
      modeP2A: 'Book → Audio',
      modeA2P: 'Audio → Book',
      inLabelP2A: "I'm at",
      inLabelA2P: 'The audio is at',
      outLabelP2A: 'Set the audio to',
      outLabelA2P: 'In the book you are at',
      unitPage: 'pg', unitLoc: 'loc',
      unitPageLong: 'Page', unitPctLong: 'Percent', unitLocLong: 'Location',
      ofTotal: 'of {n}',
      approxPage: '≈ page {n}',
      adjust: 'Correct with the real spot',
      copied: 'Copied',
      pointSaved: 'Point saved',
      beyondEnd: "That's past the end of the book.",
      beyondDur: "That's longer than the audiobook.",
      setupNeeded: "Enter the book's pages and the audiobook's length to start.",
      setupBtn: 'Fill in book details',
      footPages: '{n} pages',
      points0: 'no reference points', points1: '1 reference point', pointsN: '{n} reference points',
      settingsTitle: 'Book details',
      fTitle: 'Title', fTitlePh: 'e.g. Deadhouse Gates',
      fPages: 'Total pages',
      fDur: 'Audio length',
      fLocs: 'Total Kindle locations (optional)',
      fLocsHint: 'Only if you want to type the location instead of the page. You can see it at the end of the book.',
      pointsTitle: 'Reference points',
      pointsHint: 'Moments where you know the exact page and time. The more, and the more spread out, the better.',
      pointsEmpty: 'None yet. They are added when you use “Correct with the real spot”.',
      pointsDropped: "Some point doesn't fit with the others and is ignored (shown crossed out). Check or delete it.",
      addPoint: 'Add point',
      deleteBook: 'Delete this book',
      deletePoint: 'Delete point',
      done: 'Done', close: 'Close', save: 'Save', cancel: 'Cancel', del: 'Delete',
      pointTitle: 'Real spot',
      pointText: "Enter where you really are in the book and in the audio. It's saved as a reference and sharpens future estimates.",
      pointTime: 'Audio time',
      pointErrPos: 'The position must be inside the book.',
      pointErrTime: "The time must be within the audiobook's length.",
      booksTitle: 'Your books', newBook: 'New book',
      menuTitle: 'Options', theme: 'Theme', themeDark: 'Dark', themeLight: 'Light', language: 'Language', help: 'Help',
      exportBtn: 'Export backup', importBtn: 'Import backup',
      importDone: 'Imported: {n}', importFail: "That file isn't a valid backup.",
      confirmDeleteTitle: 'Delete book',
      confirmDeleteText: "Its details and reference points will be erased. This can't be undone.",
      faq: [
        ['How do I use it?', 'Pick the book at the top, type where you are and it tells you where to set the audio. The switch at the top flips the direction, from audio to book. Tap the result to copy it.'],
        ['How do I make it more accurate?', 'When you fine-tune the audio by ear and find the exact spot, tap “Correct with the real spot” and save it. Each point sharpens the estimate around that part of the book. With two or more spread out, it is usually within a few seconds.'],
        ['Page, percent or location?', 'Use whatever your Kindle shows. To use locations, first add the total locations in the book details.'],
        ['My audiobook has chapters. Is this useful?', 'If your player marks chapters, those markers are exact. This app is mainly meant for one long single-file recording.'],
        ['Where is my data stored?', 'Only on this device, inside the browser. Nobody else sees it. If you switch phones or browsers, export a backup from Options and import it on the new one.']
      ]
    }
  };

  // ---------- Storage ----------
  const KEY = 'kindleAudioSync_v3', OLD_KEY = 'kindleAudioSync_v2';
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
  };

  let lang = (() => {
    const s = store.get('lang'); if (s && dict[s]) return s;
    const n = (navigator.language || 'es').slice(0, 2).toLowerCase();
    return dict[n] ? n : 'es';
  })();
  const t = (k, vars) => {
    let s = dict[lang][k] ?? dict.es[k] ?? k;
    if (vars && typeof s === 'string') for (const v in vars) s = s.replace('{' + v + '}', vars[v]);
    return s;
  };

  const uid = () => 'b_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const newBook = () => ({ id: uid(), title: '', pages: 0, locs: 0, dur: 0, points: [], unit: 'page', lastPos: '', lastTime: '' });

  function cleanBook(b) {
    const n = (x) => Math.max(0, Math.round(+x || 0));
    return {
      id: String(b.id || uid()), title: String(b.title || ''),
      pages: n(b.pages), locs: n(b.locs), dur: n(b.dur),
      points: Array.isArray(b.points) ? b.points.filter(p => isFinite(+p.f) && isFinite(+p.t)).map(p => ({ f: +p.f, t: Math.round(+p.t) })) : [],
      unit: ['page', 'pct', 'loc'].includes(b.unit) ? b.unit : 'page',
      lastPos: String(b.lastPos || ''), lastTime: String(b.lastTime || '').replace(/\D/g, '')
    };
  }

  // Converts saved books from the previous version (two fixed points A and B)
  function migrate(old) {
    const books = (old.profiles || []).map(p => {
      const pages = Math.max(0, parseInt(p.totalPages) || 0);
      const dur = (parseInt(p.h) || 0) * 3600 + (parseInt(p.m) || 0) * 60 + (parseInt(p.s) || 0);
      const points = [];
      [['refPageA', 'refHA', 'refMA', 'refSA'], ['refPageB', 'refHB', 'refMB', 'refSB']].forEach(([pg, h, m, s]) => {
        const page = parseInt(p[pg]) || 0;
        const tt = (parseInt(p[h]) || 0) * 3600 + (parseInt(p[m]) || 0) * 60 + (parseInt(p[s]) || 0);
        if (page > 0 && pages > 0 && page <= pages && tt <= dur && !points.some(q => Math.abs(q.f - page / pages) < 1e-9)) {
          points.push({ f: page / pages, t: tt });
        }
      });
      return cleanBook({ id: p.id, title: p.title, pages, dur, points });
    });
    return { books, activeId: old.activeId, theme: old.theme === 'light' ? 'light' : 'dark', mode: old.lastTab === 'a2p' ? 'a2p' : 'p2a' };
  }

  function loadState() {
    try { const raw = store.get(KEY); if (raw) { const s = JSON.parse(raw); s.books = (s.books || []).map(cleanBook); return s; } } catch (e) {}
    try { const raw = store.get(OLD_KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
    return { books: [], activeId: null, theme: 'dark', mode: 'p2a' };
  }
  const state = loadState();
  if (!state.books.length) state.books.push(newBook());
  if (!state.books.some(b => b.id === state.activeId)) state.activeId = state.books[0].id;
  const save = () => store.set(KEY, JSON.stringify(state));
  save();
  const book = () => state.books.find(b => b.id === state.activeId);

  // ---------- Time helpers ----------
  const pad = (n) => String(n).padStart(2, '0');
  const fmtTime = (sec) => {
    sec = Math.max(0, Math.round(sec));
    return `${Math.floor(sec / 3600)}:${pad(Math.floor(sec % 3600 / 60))}:${pad(sec % 60)}`;
  };
  // Time typed as digits, filled from the right: 41230 -> 4:12:30
  const normDigits = (s) => String(s).replace(/\D/g, '').replace(/^0+/, '').slice(0, 7);
  const fmtDigits = (d) => {
    if (!d) return '';
    const s = d.slice(-2).padStart(2, '0'), m = d.slice(-4, -2), h = d.slice(0, -4);
    return h ? `${h}:${m.padStart(2, '0')}:${s}` : `${m || '0'}:${s}`;
  };
  const digitsToSec = (d) => {
    if (!d) return null;
    return (parseInt(d.slice(0, -4)) || 0) * 3600 + (parseInt(d.slice(-4, -2)) || 0) * 60 + (parseInt(d.slice(-2)) || 0);
  };
  const secToDigits = (sec) => {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return normDigits(h ? `${h}${pad(m)}${pad(s)}` : `${m}${pad(s)}`);
  };
  function bindTime(el, onChange) {
    el.addEventListener('input', () => {
      const d = normDigits(el.value);
      el.value = fmtDigits(d);
      el.dataset.d = d;
      try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
      onChange && onChange(d);
    });
  }
  const setTime = (el, d) => { d = normDigits(d || ''); el.dataset.d = d; el.value = fmtDigits(d); };

  // ---------- Position helpers ----------
  const cleanPos = (v, unit) => unit === 'pct'
    ? v.replace(/[^\d.,]/g, '').replace(',', '.').replace(/(\..*)\./g, '$1')
    : v.replace(/\D/g, '');
  function fracFrom(b, unit, raw) {
    const v = parseFloat(String(raw).replace(',', '.'));
    if (!isFinite(v) || raw === '') return null;
    if (unit === 'pct') return v / 100;
    if (unit === 'loc') return b.locs ? v / b.locs : null;
    return b.pages ? v / b.pages : null;
  }
  function fracTo(b, unit, f) {
    if (unit === 'pct') return String(Math.round(f * 1000) / 10);
    if (unit === 'loc') return String(Math.round(f * b.locs));
    return String(Math.round(f * b.pages));
  }
  const pageOf = (b, f) => Math.min(b.pages, Math.max(f > 0 ? 1 : 0, Math.round(f * b.pages)));

  // ---------- Model ----------
  // Points are (f = fraction of the book, t = seconds). Piecewise linear between neighbouring points,
  // extended at the edges with the slope of the nearest segment.
  function model(b) {
    const T = b.dur;
    const sorted = b.points.slice().sort((p, q) => p.f - q.f);
    const ok = [], bad = [];
    sorted.forEach(p => {
      const prev = ok[ok.length - 1];
      if (p.f <= 0 || p.f > 1 || p.t < 0 || p.t > T || (prev && (p.f <= prev.f || p.t <= prev.t))) bad.push(p);
      else ok.push(p);
    });
    let a;
    if (ok.length >= 2) a = ok;
    else if (ok.length === 1) {
      const p = ok[0];
      a = (p.f < 1 && p.t < T) ? [p, { f: 1, t: T }] : [{ f: 0, t: 0 }, p];
    } else a = [{ f: 0, t: 0 }, { f: 1, t: T }];
    return { a, bad, T };
  }
  function interp(a, x, from, to) {
    const n = a.length;
    let k = 0;
    if (x >= a[n - 1][from]) k = n - 2;
    else if (x > a[0][from]) { while (k < n - 2 && a[k + 1][from] < x) k++; }
    const p = a[k], q = a[k + 1];
    if (q[from] === p[from]) return p[to];
    return p[to] + (x - p[from]) * (q[to] - p[to]) / (q[from] - p[from]);
  }
  const timeAt = (m, f) => Math.min(m.T, Math.max(0, interp(m.a, f, 'f', 't')));
  const fracAt = (m, s) => Math.min(1, Math.max(0, interp(m.a, s, 't', 'f')));

  // ---------- Elements ----------
  const $ = (id) => document.getElementById(id);
  const el = {
    bookName: $('bookName'), posIn: $('posIn'), timeIn: $('timeIn'), inLabel: $('inLabel'), unitChips: $('unitChips'),
    warn: $('warn'), outLabel: $('outLabel'), out: $('out'), outMain: $('outMain'), outSub: $('outSub'),
    setupBox: $('setupBox'), calcBox: $('calcBox'), foot: $('foot'), toast: $('toast'),
    fTitle: $('fTitle'), fPages: $('fPages'), fDur: $('fDur'), fLocs: $('fLocs'),
    pointsList: $('pointsList'), pointsEmpty: $('pointsEmpty'), pointsWarn: $('pointsWarn'),
    pPos: $('pPos'), pTime: $('pTime'), pPosLabel: $('pPosLabel'), pErr: $('pErr')
  };
  let current = null; // last result {f, t}

  // ---------- Rendering ----------
  function applyText() {
    document.documentElement.lang = lang;
    document.title = t('appTitle');
    document.querySelectorAll('[data-t]').forEach(n => n.textContent = t(n.dataset.t));
    document.querySelectorAll('[data-tph]').forEach(n => n.placeholder = t(n.dataset.tph));
    document.querySelectorAll('[data-taria]').forEach(n => n.setAttribute('aria-label', t(n.dataset.taria)));
    const faq = $('faq'); faq.innerHTML = '';
    t('faq').forEach(([q, a]) => {
      const h = document.createElement('h3'); h.textContent = q;
      const p = document.createElement('p'); p.textContent = a;
      faq.append(h, p);
    });
    document.querySelectorAll('#langSeg button').forEach(bt => bt.setAttribute('aria-pressed', bt.dataset.lang === lang));
  }

  function applyTheme() {
    document.documentElement.dataset.theme = state.theme;
    $('metaTheme').content = state.theme === 'light' ? '#eee9dd' : '#111317';
    document.querySelectorAll('#themeSeg button').forEach(bt => bt.setAttribute('aria-pressed', bt.dataset.theme === state.theme));
  }

  function pointsText(n) { return n === 0 ? t('points0') : n === 1 ? t('points1') : t('pointsN', { n }); }

  function render() {
    const b = book();
    el.bookName.textContent = b.title || t('untitled');
    if (b.unit === 'loc' && !b.locs) b.unit = 'page';

    document.querySelectorAll('#modeSeg button').forEach(bt => bt.setAttribute('aria-pressed', bt.dataset.mode === state.mode));
    const p2a = state.mode === 'p2a';
    el.inLabel.textContent = t(p2a ? 'inLabelP2A' : 'inLabelA2P');
    el.inLabel.htmlFor = p2a ? 'posIn' : 'timeIn';
    el.outLabel.textContent = t(p2a ? 'outLabelP2A' : 'outLabelA2P');
    el.unitChips.hidden = !p2a;
    el.posIn.hidden = !p2a;
    el.timeIn.hidden = p2a;
    document.querySelectorAll('#unitChips button').forEach(bt => {
      bt.setAttribute('aria-pressed', bt.dataset.unit === b.unit);
      if (bt.dataset.unit === 'loc') bt.hidden = !b.locs;
    });
    el.posIn.inputMode = b.unit === 'pct' ? 'decimal' : 'numeric';
    if (document.activeElement !== el.posIn) el.posIn.value = b.lastPos;
    if (document.activeElement !== el.timeIn) setTime(el.timeIn, b.lastTime);

    const ready = b.pages > 0 && b.dur > 0;
    el.setupBox.hidden = ready;
    el.calcBox.hidden = !ready;

    const m = model(b);
    el.foot.textContent = ready
      ? `${t('footPages', { n: b.pages })} · ${fmtTime(b.dur)} · ${pointsText(b.points.length - m.bad.length)}`
      : '';
    el.foot.hidden = !ready;
    if (ready) calc(m);
  }

  function calc(m) {
    const b = book();
    m = m || model(b);
    let warn = '';
    current = null;
    el.outSub.hidden = true;
    if (state.mode === 'p2a') {
      let f = fracFrom(b, b.unit, b.lastPos);
      if (f == null) { el.outMain.textContent = '—'; }
      else {
        if (f > 1) { warn = t('beyondEnd'); f = 1; }
        const s = timeAt(m, f);
        current = { f, t: s };
        el.outMain.textContent = fmtTime(s);
        if (b.unit !== 'page') { el.outSub.textContent = t('approxPage', { n: pageOf(b, f) }); el.outSub.hidden = false; }
      }
    } else {
      let s = digitsToSec(b.lastTime);
      if (s == null) { el.outMain.textContent = '—'; }
      else {
        if (s > b.dur) { warn = t('beyondDur'); s = b.dur; }
        const f = fracAt(m, s);
        current = { f, t: s };
        el.outMain.textContent = '';
        const num = document.createElement('span'); num.textContent = pageOf(b, f);
        const of = document.createElement('small'); of.textContent = t('ofTotal', { n: b.pages });
        el.outMain.append(num, of);
        const pct = (Math.round(f * 1000) / 10).toLocaleString(lang) + ' %';
        el.outSub.textContent = b.locs ? `${pct} · ${t('unitLoc')} ${Math.round(f * b.locs)}` : pct;
        el.outSub.hidden = false;
      }
    }
    el.warn.textContent = warn;
    el.warn.hidden = !warn;
  }

  function renderSettings() {
    const b = book();
    if (document.activeElement !== el.fTitle) el.fTitle.value = b.title;
    if (document.activeElement !== el.fPages) el.fPages.value = b.pages || '';
    if (document.activeElement !== el.fLocs) el.fLocs.value = b.locs || '';
    if (document.activeElement !== el.fDur) setTime(el.fDur, secToDigits(b.dur));
    renderPoints();
  }

  function renderPoints() {
    const b = book();
    const m = model(b);
    const list = el.pointsList;
    list.innerHTML = '';
    const sorted = b.points.slice().sort((p, q) => p.f - q.f);
    sorted.forEach(p => {
      const li = document.createElement('li');
      if (m.bad.includes(p)) li.classList.add('bad');
      const a = document.createElement('span'); a.className = 'p';
      a.textContent = b.pages ? `${t('unitPage')} ${pageOf(b, p.f)}` : `${Math.round(p.f * 1000) / 10} %`;
      const tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = fmtTime(p.t);
      const x = document.createElement('button'); x.className = 'icon-btn'; x.setAttribute('aria-label', t('deletePoint'));
      x.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
      x.addEventListener('click', () => {
        b.points = b.points.filter(q => q !== p);
        save(); renderPoints(); render();
      });
      li.append(a, tm, x);
      list.append(li);
    });
    list.hidden = !sorted.length;
    el.pointsEmpty.hidden = !!sorted.length;
    el.pointsWarn.hidden = !m.bad.length;
  }

  // ---------- Toast & copy ----------
  let toastTimer;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1400);
  }
  el.out.addEventListener('click', () => {
    if (!current) return;
    const b = book();
    const text = state.mode === 'p2a' ? fmtTime(current.t) : String(pageOf(b, current.f));
    const done = () => {
      el.out.classList.add('flash'); setTimeout(() => el.out.classList.remove('flash'), 350);
      toast(t('copied'));
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
    else done();
  });

  // ---------- Dialogs ----------
  function open(dlg) { if (!dlg.open) dlg.showModal(); }
  document.querySelectorAll('dialog').forEach(d => {
    d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
    d.querySelectorAll('[data-close]').forEach(bt => bt.addEventListener('click', () => d.close()));
  });
  function confirmBox(title, text, yes) {
    return new Promise(res => {
      const d = $('confirmDlg');
      $('cTitle').textContent = title; $('cText').textContent = text; $('cYes').textContent = yes;
      const finish = (v) => { d.close(); res(v); };
      $('cYes').onclick = () => finish(true);
      $('cNo').onclick = () => finish(false);
      d.onclose = () => res(false);
      open(d);
    });
  }

  // ---------- Main interactions ----------
  document.querySelectorAll('#modeSeg button').forEach(bt => bt.addEventListener('click', () => {
    state.mode = bt.dataset.mode; save(); render();
  }));
  document.querySelectorAll('#unitChips button').forEach(bt => bt.addEventListener('click', () => {
    const b = book();
    if (b.unit === bt.dataset.unit) return;
    // Convert what was typed into the new unit so the result stays the same
    const f = fracFrom(b, b.unit, b.lastPos);
    b.unit = bt.dataset.unit;
    b.lastPos = f == null ? '' : fracTo(b, b.unit, Math.min(f, 1));
    el.posIn.value = b.lastPos;
    save(); render();
  }));
  el.posIn.addEventListener('focus', () => requestAnimationFrame(() => el.posIn.select()));
  el.timeIn.addEventListener('focus', () => requestAnimationFrame(() => el.timeIn.select()));
  el.posIn.addEventListener('input', () => {
    const b = book();
    const v = cleanPos(el.posIn.value, b.unit);
    if (v !== el.posIn.value) el.posIn.value = v;
    b.lastPos = v; save(); calc();
  });
  bindTime(el.timeIn, (d) => { book().lastTime = d; save(); calc(); });
  [el.posIn, el.timeIn].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') i.blur(); }));

  $('setupBtn').addEventListener('click', openSettings);
  el.foot.addEventListener('click', openSettings);
  $('settingsBtn').addEventListener('click', openSettings);
  function openSettings() { renderSettings(); open($('settingsDlg')); }

  // ---------- Books ----------
  function renderBooks() {
    const ul = $('booksList'); ul.innerHTML = '';
    state.books.forEach(b => {
      const li = document.createElement('li');
      const bt = document.createElement('button');
      bt.setAttribute('aria-current', b.id === state.activeId);
      const dot = document.createElement('span'); dot.className = 'dot';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = b.title || t('untitled');
      const meta = document.createElement('span'); meta.className = 'meta';
      meta.textContent = b.lastPos && b.unit === 'page' ? `${t('unitPage')} ${b.lastPos}` : '';
      bt.append(dot, name, meta);
      bt.addEventListener('click', () => {
        state.activeId = b.id; save(); render(); $('booksDlg').close();
      });
      li.append(bt); ul.append(li);
    });
  }
  $('bookBtn').addEventListener('click', () => { renderBooks(); open($('booksDlg')); });
  $('newBookBtn').addEventListener('click', () => {
    const b = newBook(); state.books.push(b); state.activeId = b.id; save(); render();
    $('booksDlg').close(); openSettings(); el.fTitle.focus();
  });

  // ---------- Settings fields ----------
  el.fTitle.addEventListener('input', () => { book().title = el.fTitle.value.trim(); save(); render(); });
  el.fPages.addEventListener('input', () => {
    const v = el.fPages.value.replace(/\D/g, ''); if (v !== el.fPages.value) el.fPages.value = v;
    book().pages = parseInt(v) || 0; save(); render(); renderPoints();
  });
  el.fLocs.addEventListener('input', () => {
    const v = el.fLocs.value.replace(/\D/g, ''); if (v !== el.fLocs.value) el.fLocs.value = v;
    book().locs = parseInt(v) || 0; save(); render();
  });
  bindTime(el.fDur, (d) => { book().dur = digitsToSec(d) || 0; save(); render(); renderPoints(); });
  [el.fPages, el.fLocs, el.fDur].forEach(i => i.addEventListener('focus', () => requestAnimationFrame(() => i.select())));

  $('deleteBookBtn').addEventListener('click', async () => {
    const ok = await confirmBox(t('confirmDeleteTitle'), t('confirmDeleteText'), t('del'));
    if (!ok) return;
    state.books = state.books.filter(b => b.id !== state.activeId);
    if (!state.books.length) state.books.push(newBook());
    state.activeId = state.books[0].id;
    save(); $('settingsDlg').close(); render();
  });

  // ---------- Reference point ----------
  let pointUnit = 'page';
  function openPoint() {
    const b = book();
    pointUnit = b.unit === 'loc' && !b.locs ? 'page' : b.unit;
    el.pPosLabel.textContent = t(pointUnit === 'pct' ? 'unitPctLong' : pointUnit === 'loc' ? 'unitLocLong' : 'unitPageLong');
    el.pPos.inputMode = pointUnit === 'pct' ? 'decimal' : 'numeric';
    el.pPos.value = current ? fracTo(b, pointUnit, current.f) : '';
    setTime(el.pTime, current ? secToDigits(current.t) : '');
    el.pErr.hidden = true;
    open($('pointDlg'));
  }
  $('adjustBtn').addEventListener('click', openPoint);
  $('addPointBtn').addEventListener('click', openPoint);
  el.pPos.addEventListener('input', () => { const v = cleanPos(el.pPos.value, pointUnit); if (v !== el.pPos.value) el.pPos.value = v; });
  bindTime(el.pTime);
  [el.pPos, el.pTime].forEach(i => i.addEventListener('focus', () => requestAnimationFrame(() => i.select())));
  $('pointForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const b = book();
    const f = fracFrom(b, pointUnit, el.pPos.value);
    const s = digitsToSec(el.pTime.dataset.d || '');
    let err = '';
    if (f == null || f <= 0 || f > 1) err = t('pointErrPos');
    else if (s == null || s > b.dur) err = t('pointErrTime');
    if (err) { el.pErr.textContent = err; el.pErr.hidden = false; return; }
    // Replace a point on the same page instead of duplicating it
    const same = (p) => b.pages ? pageOf(b, p.f) === pageOf(b, f) : Math.abs(p.f - f) < 1e-4;
    b.points = b.points.filter(p => !same(p));
    b.points.push({ f, t: s });
    save();
    $('pointDlg').close();
    render();
    if ($('settingsDlg').open) renderPoints(); else toast(t('pointSaved'));
  });

  // ---------- Menu ----------
  $('menuBtn').addEventListener('click', () => open($('menuDlg')));
  document.querySelectorAll('#themeSeg button').forEach(bt => bt.addEventListener('click', () => {
    state.theme = bt.dataset.theme; save(); applyTheme();
  }));
  document.querySelectorAll('#langSeg button').forEach(bt => bt.addEventListener('click', () => {
    lang = bt.dataset.lang; store.set('lang', lang); applyText(); render();
  }));
  $('helpBtn').addEventListener('click', () => { $('menuDlg').close(); open($('helpDlg')); });

  $('exportBtn').addEventListener('click', async () => {
    const data = JSON.stringify({ app: 'kindle-audiolibro', version: 3, books: state.books }, null, 2);
    const name = 'kindle-audiolibro-copia.json';
    try {
      const file = new File([data], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const incoming = Array.isArray(data.books) ? data.books.map(cleanBook)
        : Array.isArray(data.profiles) ? migrate(data).books : null;
      if (!incoming || !incoming.length) throw new Error('empty');
      incoming.forEach(nb => {
        const i = state.books.findIndex(b => b.id === nb.id);
        if (i >= 0) state.books[i] = nb; else state.books.push(nb);
      });
      // Drop the blank starter book if it was never touched
      state.books = state.books.filter(b => b.title || b.pages || b.dur || state.books.length === 1);
      if (!state.books.some(b => b.id === state.activeId)) state.activeId = incoming[0].id;
      save(); render(); $('menuDlg').close();
      toast(t('importDone', { n: incoming.length }));
    } catch (err) { toast(t('importFail')); }
  });

  // ---------- Start ----------
  applyTheme();
  applyText();
  render();
})();
</script>
</body>
</html>
